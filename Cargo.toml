[package]
name = "dongie"
version = "0.1.0"
edition = "2021"
description = "Web dashboard + API for OpenStick MSM8916 4G USB dongles"
readme = "README.md"
license = "EUPL-1.2"

# All dependencies must stay pure Rust: we cross-link with rust-lld, no C toolchain.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "net", "fs", "signal", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
